name: Build and Upload

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload dist files
        uses: actions/upload-artifact@v7
        with:
          name: plugin-dist
          path: |
            main.js
            manifest.json
            styles.css
